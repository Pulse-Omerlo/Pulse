[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Only the packages the code uses; uv.lock pins everything they depend on.
dependencies = [
    "alembic==1.20.1",
    "boto3>=1.43.116",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "phonenumbers==9.0.42",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "rapidfuzz==3.14.6",
    "sentry-sdk==2.73.0",
    "sqlalchemy>=2.1.5",
    "starlette==1.10.0",
    "structlog>=26.1.0",
    "tldextract==5.4.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a real PostgreSQL database (TEST_DATABASE_URL); skipped when unset",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
# Command-line output for whoever runs the generator, not application logging.
"synthetic/omerlo_fixtures.py" = ["T201"]
"synthetic/mock_omerlo.py" = ["T201"]
"synthetic/mutate.py" = ["T201"]
"synthetic/pipeline/__main__.py" = ["T201"]
"synthetic/viewer/__main__.py" = ["T201"]
"app/seed.py" = ["T201"]
"app/sync.py" = ["T201"]
"app/import_file.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app", "synthetic"]
branch = true

[tool.coverage.report]
# CI fails below this; core logic modules aim for 80 percent.
fail_under = 50
show_missing = true
skip_empty = true
